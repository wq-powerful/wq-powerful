<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>页面跳转中 | 吴倩 - AI 产品经理</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var basePath = '/wq-powerful/';
        var redirectPath = location.pathname + location.search + location.hash;
        if (redirectPath !== basePath && !redirectPath.endsWith('/404.html')) {
          sessionStorage.setItem('redirect', redirectPath);
        }
        location.replace(basePath);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/wq-powerful/" />
  </head>
  <body>
    <p><a href="/wq-powerful/">返回站点首页</a></p>
  </body>
</html>
